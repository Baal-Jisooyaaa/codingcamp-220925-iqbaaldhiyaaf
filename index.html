<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <header>
    <nav>
      <ul class="navbar">
        <img src="logo jabar.svg" height="70px">
        <li><a href="#home">Home</a></li>
        <li><a href="#ourprofile">Our Profile</a></li>
        <li><a href="#contact">Message Us</a></li>
      </ul>
    </nav>
  </header>

<!-- Section Home -->
  <section id="home" class="banner">
    
    <h1 id="welcomeText">Hi, Welcome to Website</h1>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRw6r9JVanCH3dYmhrPOmLPfXCgzvgf1o1rTQ&s" height="500px" alt="Logo BPSDM">
  </section>

  <!-- Section Our Profile -->
  <section id="ourprofile" class="profile">
    <h2>Our Profile</h2>
    <p>Badan Pengembangan Sumber Daya Manusia Provinsi Jawa Barat</p>
    <div class="team">
      <div class="circle">Kepala Badan</div>
      <div class="circle">Sekretaris Badan</div>
      <div class="circle">Kepala Bidang</div>
    </div>
  </section>

  <!-- Section Message Us -->
  <section id="contact" class="contact">
    <h2>Message Us</h2>
    <form id="messageForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br>

      <label for="phone">Phone Number:</label>
      <input type="text" id="phone" name="phone" required><br>

      <label for="message">Message:</label>
      <textarea id="message" name="message" required></textarea><br>

      <button type="submit">Submit</button>
    </form>

    <div id="formResult"></div>
  </section>

  <!-- Script JS -->
  <script src="js/script.js"></script>
</body>
</html>
